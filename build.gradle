plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
    id 'com.modrinth.minotaur' version '2.9.0'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'org.milkteamc'
version = '1.8.0'

// Java Configuration
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

spotless {
  format 'misc', {
    target '*.gradle', '.gitattributes', '.gitignore'

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces()
    endWithNewline()
  }
  java {
    removeUnusedImports()
    formatAnnotations()
    palantirJavaFormat()

    licenseHeaderFile(rootProject.file('spotless/HEADER'))
  }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }

    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }

    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }

    maven {
        name = 'xenondevs'
        url = 'https://repo.xenondevs.xyz/releases'
    }

    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }

    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'

    implementation 'io.github.revxrsal:lamp.common:4.0.0-rc.18'
    implementation 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.18'

    implementation 'com.github.Anon8281:UniversalScheduler:0.1.7'
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'io.github.almighty-satan:XSeries:13.6.0+26.1'
    implementation 'dev.dejvokep:boosted-yaml:1.3.7'

    compileOnly 'me.clip:placeholderapi:2.12.2'
    compileOnly files('./libs/Residence5.1.4.3.jar')
    compileOnly 'com.github.angeschossen:LandsAPI:7.17.2'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'
    compileOnly 'com.github.GriefPrevention:GriefPrevention:16.18.4'
}

test {
    useJUnitPlatform()
    // Mockito appends to the bootstrap classpath; disable CDS for this test JVM.
    jvmArgs '-Xshare:off'
}

configurations {
    legacyPaperTestRuntime {
        canBeConsumed = false
        extendsFrom testRuntimeClasspath
        resolutionStrategy {
            force 'io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT'
            eachDependency {
                if (requested.group == 'net.kyori' && requested.name.startsWith('adventure-')) {
                    useVersion '4.11.0'
                }
            }
        }
    }
}

tasks.register('testLegacyPaperMessages', Test) {
    description = 'Verify native messages against Paper 1.18.2 and its Adventure version.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + configurations.legacyPaperTestRuntime
    filter {
        includeTestsMatching 'org.milkteamc.autotreechop.translation.TranslationManagerTest'
    }
    useJUnitPlatform()
    jvmArgs '-Xshare:off'
}

compileJava {
    // Preserve parameter names in the bytecode
    options.compilerArgs += ["-parameters"]
    // options.compilerArgs += ["-Xlint:deprecation"]
}

def gitHash = 'unknown'
def gitBranch = 'unknown'
def gitMessage = 'No commit message available.'

try {
    def hashProc = 'git rev-parse --short=7 HEAD'.execute()
    hashProc.waitFor()
    if (hashProc.exitValue() == 0) {
        gitHash = hashProc.text.trim()
    }

    def branchProc = 'git rev-parse --abbrev-ref HEAD'.execute()
    branchProc.waitFor()
    if (branchProc.exitValue() == 0) {
        gitBranch = branchProc.text.trim()
    }

    def msgProc = 'git log -1 --pretty=%B'.execute()
    msgProc.waitFor()
    if (msgProc.exitValue() == 0) {
        gitMessage = msgProc.text.trim()
    }
} catch (Exception ignored) {
    // Git commands failed, use defaults
}

def isRelease = project.hasProperty('release')
def fullVersion = isRelease ? version : "${version}-alpha+${gitHash}"

processResources {
    def props = [version: fullVersion]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.build {
    dependsOn('shadowJar')
}

tasks.jar {
    archiveFileName = "AutoTreeChop-${fullVersion}-original.jar"
}

tasks.shadowJar {
    archiveFileName = "AutoTreeChop-${fullVersion}.jar"
    configurations = [project.configurations.runtimeClasspath]
    minimize()

    // Let Shadow merge all Kotlin module metadata before removing duplicates.
    filesMatching('META-INF/*.kotlin_module') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    relocate 'com.jeff_media.updatechecker', 'org.milkteamc.autotreechop.libs.updatechecker'
    relocate 'com.zaxxer.hikari', 'org.milkteamc.autotreechop.libs.hikari'
    relocate 'org.bstats', 'org.milkteamc.autotreechop.libs.bstats'
    relocate 'com.github.Anon8281.universalScheduler', 'org.milkteamc.autotreechop.libs.universalScheduler'
    relocate 'com.cryptomorin.xseries', 'org.milkteamc.autotreechop.libs.xseries'
    relocate 'revxrsal.commands', 'org.milkteamc.autotreechop.libs.lamp'
    relocate 'dev.dejvokep.boostedyaml', 'org.milkteamc.autotreechop.libs.boostedyaml'

    from('LICENSE') {
        into 'META-INF'
    }

    manifest {
        attributes(
            'Implementation-Version': fullVersion,
            'Git-Commit': gitHash,
            'Git-Branch': gitBranch
        )
    }
}

tasks.runServer {
    minecraftVersion('26.3')
    def javaVersion = Math.max(25, JavaVersion.current().majorVersion.toInteger())
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

runPaper.folia.registerTask()

tasks.named('runFolia') {
    javaLauncher = tasks.runServer.javaLauncher
    runDirectory = layout.projectDirectory.dir('run/folia')
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = 'autotreechop'
    versionType = 'alpha'

    versionNumber = fullVersion
    versionName = "v${fullVersion}"
    changelog = """
        🚨 **This is an ALPHA version - Use at your own risk!**

        **Branch:** `${gitBranch}`
        **Commit:** `${gitHash}`

        **Latest Changes:**
        > ${gitMessage}

        ---

        📝 Report issues: [GitHub Issues](https://github.com/milkteamc/AutoTreeChop/issues)
        💬 Get support: [Matrix](https://matrix.to/#/#maoyue-dev:matrix.org)
    """.stripIndent().trim()

    uploadFile = tasks.shadowJar.archiveFile

    gameVersions = [
            '1.18.2',
            '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
            '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
            '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6',
            '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11',
            '26.1', '26.1.1', '26.1.2', '26.2', '26.3'
    ]

    loaders = ['paper', 'purpur', 'folia']

    dependencies {
        optional.project 'placeholderapi'
    }
}

// Verify the documented consumer against the distributable JAR, not loose project classes.
tasks.register('compileApiExample', JavaCompile) {
    dependsOn tasks.shadowJar
    source = fileTree('docs/examples') { include '**/*.java' }
    classpath = files(tasks.shadowJar.archiveFile) + configurations.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('api-example')
    javaCompiler = tasks.compileJava.javaCompiler
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.register('verifyAdventurePackaging') {
    dependsOn tasks.shadowJar
    inputs.file(tasks.shadowJar.archiveFile)
    doLast {
        def bundledAdventure = zipTree(tasks.shadowJar.archiveFile.get().asFile).matching {
            include 'net/kyori/**'
            include 'org/milkteamc/autotreechop/libs/kyori/**'
        }
        if (!bundledAdventure.isEmpty()) {
            throw new GradleException('The plugin JAR must use Paper-provided Adventure, not bundle it.')
        }
    }
}

tasks.check {
    dependsOn tasks.named('compileApiExample'), tasks.named('verifyAdventurePackaging'), tasks.named('testLegacyPaperMessages')
}
